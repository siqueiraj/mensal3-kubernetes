# Perfil de produção — todos os valores sensíveis vêm de variáveis de ambiente,
# injetadas pelo docker-compose.yml na EC2 (nunca de arquivo versionado no Git).

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# validate: nunca altera o schema automaticamente em produção (evita perda de dados
# por uma migração inesperada). Em dev usamos "update" por conveniência.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}

logging.level.org.springframework.security=INFO

# Expõe apenas o endpoint de health check publicamente, usado pela pipeline
# de CI/CD para validar se o deploy funcionou.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
